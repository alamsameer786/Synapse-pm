<!DOCTYPE html>
<html>
<head><title>Authenticating...</title></head>
<body>
    <p>Completing login...</p>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const provider = sessionStorage.getItem('oauth_provider') || 'google';
        
        if (code) {
            fetch('/api/v1/auth/oauth/exchange', { // <-- MUST BE RELATIVE
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.access_token) {
                    localStorage.setItem('synapse_token', data.access_token);
                    localStorage.setItem('synapse_user', JSON.stringify(data.user));
                    window.location.href = '/user/dashboard.html';
                } else {
                    window.location.href = '/user/login.html?error=auth_failed';
                }
            })
            .catch(() => {
                window.location.href = '/user/login.html?error=auth_failed';
            });
        } else {
            window.location.href = '/user/login.html';
        }
    </script>
</body>
</html>

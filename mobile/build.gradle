plugins {
    id 'com.android.application'
}

android {
    namespace 'com.synapsepm.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.synapsepm.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "12.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "synapsepm2024"
            keyAlias "synapsepm"
            keyPassword System.getenv("KEY_PASSWORD") ?: "synapsepm2024"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            android.defaults.buildfeatures.buildconfig = true
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // Capacitor Core
    implementation 'com.getcapacitor:core:5.7.0'
    
    // Capacitor Plugins
    implementation 'com.getcapacitor:android:5.7.0'
    implementation 'com.getcapacitor:status-bar:5.0.8'
    implementation 'com.getcapacitor:splash-screen:5.0.8'
    implementation 'com.getcapacitor:push-notifications:5.1.2'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}